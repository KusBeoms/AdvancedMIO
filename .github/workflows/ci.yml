name: CI
on:
  push:
  pull_request:
jobs:
  core-linux:
    runs-on: ubuntu-latest
    container: swift:6.0
    steps:
      - uses: actions/checkout@v4
      - run: swift test
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - run: swift --version
      - run: swift build -c release
      - run: swift test
      - run: scripts/bundle.sh
      - run: codesign --verify --verbose build/AdvancedMIO.app
