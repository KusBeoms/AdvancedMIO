name: CI
on:
  push:
  pull_request:
jobs:
  core-linux:
    runs-on: ubuntu-latest
    container: swift:6.0
    steps:
      - uses: actions/checkout@v4
      - run: swift test
  macos:
    runs-on: macos-14
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: swift --version
      - run: swift build -c release
      - run: swift test
      - run: scripts/bundle.sh
      - run: codesign --verify --verbose build/AdvancedMIO.app
      - name: Screenshot (demo mode)
        continue-on-error: true
        run: |
          mkdir -p shots
          ls /System/Library/CoreServices/CoreGlyphs.bundle >/dev/null 2>&1 && echo "CoreGlyphs present" || echo "CoreGlyphs MISSING"
          shoot() { # $1 = name, rest = app args
            name=$1; shift
            open -n build/AdvancedMIO.app --args "$@"
            sleep 7
            osascript -e 'tell application "AdvancedMIO" to activate' || true
            sleep 3
            screencapture -x "shots/$name-full.png" || true
            sips --cropToHeightWidth 700 1040 --cropOffset 160 440 "shots/$name-full.png" --out "shots/$name.png" || true
            pkill -x AdvancedMIO || true
            sleep 2
          }
          shoot demo --demo
          shoot drag --demo --demo-drag
          cat /tmp/amio_symbols.txt || true
          ls -la shots
      - name: Publish screenshot
        if: github.ref_name != 'ci-screenshots'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          [ -s shots/demo.png ] || exit 0
          rm -rf /tmp/pub && mkdir /tmp/pub && cp shots/*.png /tmp/pub/ && cd /tmp/pub
          git init -q && git checkout -q -b ci-screenshots
          git config user.name ci && git config user.email ci@users.noreply.github.com
          git add -A && git commit -qm "screenshots for ${GITHUB_SHA}"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci-screenshots
